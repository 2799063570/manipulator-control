# Copy this file to robot_test.local.yaml, then fill in the controller IP and
# confirm every motion value against the real robot's approved limits.
# Credentials are intentionally read only from AUBO_ROBOT_USERNAME and
# AUBO_ROBOT_PASSWORD environment variables.
connection:
  robot_ip: ""
  rpc_port: 30004
  rtde_port: 30010
  feedback_timeout_ms: 2000

single_joint_test:
  joint_name: shoulder_joint
  delta_rad: 0.02
  duration_s: 5.0
  speed_fraction: 0.05
  # These must be verified against the deployed robot and its controller.
  lower_limit_rad: -3.04
  upper_limit_rad: 3.04
