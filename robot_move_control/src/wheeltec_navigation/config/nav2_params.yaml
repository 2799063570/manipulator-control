# Minimal Nav2 configuration for the Gazebo Wheeltec teaching robot.
#
# The Gazebo model uses MecanumDrive, so the simulation navigation profile is
# configured as an omnidirectional base.

amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan
    robot_model_type: nav2_amcl::OmniMotionModel
    # Real robots must be initialized from RViz (2D Pose Estimate) or an
    # external localization source.  Gazebo overrides this to true because
    # its spawn pose relative to the saved map is deterministic.
    set_initial_pose: false
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    min_particles: 300
    max_particles: 1000
    max_beams: 60
    laser_model_type: likelihood_field
    laser_min_range: 0.10
    laser_max_range: 4.0
    update_min_d: 0.05
    update_min_a: 0.05
    transform_tolerance: 0.3
    tf_broadcast: true
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.005
    min_theta_velocity_threshold: 0.03
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      # This teaching example evaluates reaching the position only.  RViz's
      # goal-arrow orientation is not used as a final rotation requirement.
      yaw_goal_tolerance: 6.283185
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: -0.05
      min_vel_y: -0.15
      max_vel_x: 0.15
      max_vel_y: 0.15
      max_vel_theta: 0.45
      min_speed_xy: 0.0
      max_speed_xy: 0.20
      min_speed_theta: 0.0
      acc_lim_x: 0.20
      acc_lim_y: 0.25
      acc_lim_theta: 1.0
      decel_lim_x: -0.40
      decel_lim_y: -0.45
      decel_lim_theta: -1.5
      vx_samples: 12
      vy_samples: 12
      vtheta_samples: 16
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [Oscillation, BaseObstacle, PathDist, GoalDist, RotateToGoal]
      BaseObstacle.scale: 0.02
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 8.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      resolution: 0.05
      robot_radius: 0.13
      transform_tolerance: 0.3
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.25

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      robot_radius: 0.13
      track_unknown_space: false
      transform_tolerance: 0.3
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.25

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.25
      use_astar: false
      allow_unknown: false

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    transform_tolerance: 0.3
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 10.0
    # Gazebo's post-physics odometry can contain short angular-velocity
    # spikes while mecanum contacts settle.  Feeding those spikes back into
    # the smoother lets its output start outside the configured limits.
    feedback: OPEN_LOOP
    scale_velocities: false
    max_velocity: [0.15, 0.15, 0.50]
    min_velocity: [-0.10, -0.15, -0.50]
    max_accel: [0.20, 0.25, 1.0]
    max_decel: [-0.40, -0.45, -1.5]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
