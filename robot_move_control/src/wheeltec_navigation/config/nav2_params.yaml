# Minimal Nav2 configuration for the Gazebo Wheeltec teaching robot.
#
# The current Gazebo wheel model is used as a non-holonomic base: it can drive
# forward/backward and rotate, but it does not simulate reliable mecanum
# strafing.  Every component below therefore uses linear.y == 0.

amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    min_particles: 300
    max_particles: 1000
    max_beams: 60
    laser_model_type: likelihood_field
    laser_min_range: 0.10
    laser_max_range: 4.0
    update_min_d: 0.05
    update_min_a: 0.05
    transform_tolerance: 0.3
    tf_broadcast: true
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.03
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      # This teaching example evaluates reaching the position only.  RViz's
      # goal-arrow orientation is not used as a final rotation requirement.
      yaw_goal_tolerance: 6.283185
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: -0.10
      max_vel_x: 0.15
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.50
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 0.20
      decel_lim_x: -0.40
      acc_lim_y: 0.0
      decel_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_theta: -1.5
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 15
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [BaseObstacle, PathAlign, GoalAlign, PathDist, GoalDist, Oscillation]
      BaseObstacle.scale: 0.05
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.15
      GoalAlign.scale: 10.0
      GoalAlign.forward_point_distance: 0.15
      PathDist.scale: 24.0
      GoalDist.scale: 20.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      resolution: 0.05
      robot_radius: 0.17
      transform_tolerance: 0.3
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      robot_radius: 0.17
      track_unknown_space: false
      transform_tolerance: 0.3
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.25
      use_astar: false
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-6
      max_its: 100
      do_refinement: false

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    transform_tolerance: 0.3
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 10.0
    feedback: CLOSED_LOOP
    scale_velocities: false
    max_velocity: [0.15, 0.0, 0.50]
    min_velocity: [-0.10, 0.0, -0.50]
    max_accel: [0.20, 0.0, 1.0]
    max_decel: [-0.40, 0.0, -1.5]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
